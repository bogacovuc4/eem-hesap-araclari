<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EEM Hesap Araçları</title>
  <meta name="description" content="Elektrik-elektronik mühendisliği öğrencileri için hesaplayıcılar: RF, devre, elektronik, sinyaller, kontrol, makineler, enerji dağıtımı, haberleşme ve sayısal tasarım.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1.5' y='1.5' width='29' height='29' rx='6' fill='%23ffffff' stroke='%23c8102e' stroke-width='3'/%3E%3Cpolyline points='5,16 9,16 11,10 15,22 19,10 23,22 25,16 27,16' fill='none' stroke='%231f2a44' stroke-width='2.4' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
  <meta name="theme-color" content="#e9ecfb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#060819" media="(prefers-color-scheme: dark)">
  <script>
    // Temayı ilk boyamadan önce uygula (yanıp sönmeyi önler).
    try {
      var t = localStorage.getItem('eem-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* localStorage kapalı olabilir */ }
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <header class="topbar">
    <button id="menu-toggle" class="icon-btn" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Menüyü aç/kapat"></button>
    <a class="brand" href="#/">
      <svg class="brand-mark" width="30" height="30" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <rect x="1.5" y="1.5" width="29" height="29" rx="6" fill="var(--surface)" stroke="var(--red)" stroke-width="3"/>
        <polyline points="5,16 9,16 11,10 15,22 19,10 23,22 25,16 27,16" fill="none" stroke="var(--brand)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
      <span class="brand-name">EEM Hesap Araçları</span>
    </a>
    <a id="home-btn" class="icon-btn home-btn" href="#/" aria-label="Ana menüye dön"></a>
    <button id="theme-toggle" class="icon-btn" type="button" aria-label="Temayı değiştir"></button>
  </header>
  <div class="layout">
    <nav id="sidebar" class="sidebar" aria-label="Hesaplayıcılar"></nav>
    <main id="content" class="content">
      <noscript>Bu site JavaScript gerektirir.</noscript>
    </main>
  </div>
</body>
</html>
