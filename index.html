<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EEM Hesap Araçları</title>
  <meta name="description" content="Elektrik-elektronik mühendisliği için anten/RF, devre ve rüzgâr enerjisi hesaplayıcıları.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b3620'/%3E%3Cpolyline points='3,16 9,16 11,10 15,22 19,10 23,22 25,16 29,16' fill='none' stroke='%23fffaf2' stroke-width='2.4' stroke-linejoin='round' stroke-linecap='round'/%3E%3Ccircle cx='25.5' cy='7' r='3' fill='%23d62839'/%3E%3C/svg%3E">
  <meta name="theme-color" content="#f6efe2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a120d" media="(prefers-color-scheme: dark)">
  <script>
    // Temayı ilk boyamadan önce uygula (yanıp sönmeyi önler).
    try {
      var t = localStorage.getItem('eem-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* localStorage kapalı olabilir */ }
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <header class="topbar">
    <button id="menu-toggle" class="icon-btn" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Menüyü aç/kapat"></button>
    <a class="brand" href="#/">
      <svg class="brand-mark" width="30" height="30" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <rect width="32" height="32" rx="8" fill="var(--brand)"/>
        <polyline points="3,16 9,16 11,10 15,22 19,10 23,22 25,16 29,16" fill="none" stroke="var(--surface)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="25.5" cy="7" r="3" fill="var(--red)"/>
      </svg>
      <span class="brand-name">EEM Hesap Araçları</span>
    </a>
    <button id="theme-toggle" class="icon-btn" type="button" aria-label="Temayı değiştir"></button>
  </header>
  <div class="layout">
    <nav id="sidebar" class="sidebar" aria-label="Hesaplayıcılar"></nav>
    <main id="content" class="content">
      <noscript>Bu site JavaScript gerektirir.</noscript>
    </main>
  </div>
</body>
</html>
